# Dataset Annotation Analysis and Label Mapping Configuration
# Project: Temporal Behavior Recognition and Violence Classification
# Role: ML Student 2

version: "1.0.0"

# Target Binary Task Definition:
# 1: Violence-related behavior (active physical conflict, assault, brawl, battery, armed attack)
# 0: Non-violence / Normal behavior (routine activities, passive crowds, non-violent property events)

binary_classes:
  0: "non_violence"
  1: "violence"

# ---------------------------------------------------------------------------
# UCF-Crime Dataset Mapping
# Reference: Sultani et al., "Real-world Anomaly Detection in Surveillance Videos", CVPR 2018
# Characteristics: 1,900 untrimmed surveillance videos (128 hours), 13 anomaly classes + Normal
# License: Academic research use only
# ---------------------------------------------------------------------------
ucf_crime:
  raw_labels:
    - "Abuse"
    - "Arrest"
    - "Arson"
    - "Assault"
    - "Burglary"
    - "Explosion"
    - "Fighting"
    - "Normal_Videos_event"
    - "RoadAccidents"
    - "Robbery"
    - "Shooting"
    - "Shoplifting"
    - "Stealing"
    - "Vandalism"

  # Label Mapping with explicit rationale
  # Crucial: Unrelated anomaly labels (e.g., Shoplifting, Stealing, RoadAccidents) must NOT
  # be conflated into physical violence without justification, as doing so pollutes the
  # temporal motion signature of interpersonal physical combat.
  label_mapping:
    # Direct Physical Violence (Interpersonal physical combat / dangerous incidents)
    Assault:
      target_class: 1
      campus_relevance: "High - direct physical altercation, strikes, pushes"
      rationale: "Core violence class involving aggressive physical contact."
    Fighting:
      target_class: 1
      campus_relevance: "High - multi-person physical brawls in corridors/courtyards"
      rationale: "Prototypical violence category with rapid, high-entropy limb movement."
    Shooting:
      target_class: 1
      campus_relevance: "Critical - active shooter emergency incident"
      rationale: "Extreme danger incident requiring immediate classification."
    Abuse:
      target_class: 1
      campus_relevance: "High - physical bullying, harassment, elder/child abuse"
      rationale: "Physical domination or aggressive physical mistreatment."

    # Non-Violent Anomalies and Property Offenses (Mapped to Non-Violence class 0)
    Arrest:
      target_class: 0
      campus_relevance: "Moderate - law enforcement restraint, non-violent detention"
      rationale: "Controlled physical interaction; must not trigger false fight alarms."
    Arson:
      target_class: 0
      campus_relevance: "Low/Hazard - fire ignition"
      rationale: "Hazardous property crime, but lacks human-to-human physical fighting motion."
    Burglary:
      target_class: 0
      campus_relevance: "Moderate - forced entry"
      rationale: "Covert property offense; motion is deliberate and stealthy, not violent."
    Explosion:
      target_class: 0
      campus_relevance: "Low/Disaster"
      rationale: "Sudden visual flash/blast; handled by environmental hazard systems."
    RoadAccidents:
      target_class: 0
      campus_relevance: "Low/Traffic - vehicular collisions"
      rationale: "Vehicular dynamics, completely different from human interpersonal aggression."
    Robbery:
      target_class: 0
      campus_relevance: "Moderate - theft with intimidation/threat"
      rationale: "Often involves weapon brandishing without prolonged kinetic combat; negative for physical brawl."
    Shoplifting:
      target_class: 0
      campus_relevance: "Low - petty theft"
      rationale: "Stealthy, non-confrontational movement; negative for physical violence."
    Stealing:
      target_class: 0
      campus_relevance: "Low - property theft"
      rationale: "Stealthy movement; negative for physical violence."
    Vandalism:
      target_class: 0
      campus_relevance: "Moderate - property destruction"
      rationale: "Object interaction (e.g. spray paint, breaking fixtures); lacks interpersonal combat signature."
    Normal_Videos_event:
      target_class: 0
      campus_relevance: "High - baseline normal campus life"
      rationale: "Routine pedestrian motion, walking, conversing, standing."

# ---------------------------------------------------------------------------
# XD-Violence Dataset Mapping
# Reference: Wu et al., "Large-Scale Multi-Modal Video Violence Detection", ECCV 2020
# Characteristics: 4,754 untrimmed videos (217 hours) with frame-level interval annotations
# License: Academic research use only
# ---------------------------------------------------------------------------
xd_violence:
  raw_labels:
    - "Fighting"
    - "Shooting"
    - "Riot"
    - "Abuse"
    - "Car accident"
    - "Explosion"
    - "Normal"

  label_mapping:
    Fighting:
      target_class: 1
      official_code: "B1"
      rationale: "Direct kinetic physical brawl; core positive class."
    Shooting:
      target_class: 1
      official_code: "B2"
      rationale: "Armed assault; core positive class."
    Riot:
      target_class: 1
      official_code: "B4"
      rationale: "Mass aggressive disturbance, mob violence; core positive class."
    Abuse:
      target_class: 1
      official_code: "B5"
      rationale: "Physical battery and aggressive mistreatment; core positive class."
    Car accident:
      target_class: null
      official_code: "B6"
      disposition: "exclude"
      rationale: "A safety hazard, but outside the human-violence target. Exclude rather than call it normal."
    Explosion:
      target_class: null
      official_code: "G"
      disposition: "exclude"
      rationale: "A safety hazard, but outside the human-violence target. Exclude rather than call it normal."
    Normal:
      target_class: 0
      official_code: "A"
      rationale: "Standard unperturbed activities; negative baseline."

# ---------------------------------------------------------------------------
# Negative Sample Selection & Mining Strategy
# ---------------------------------------------------------------------------
negative_mining:
  strategy: "hard_negative_balanced_sampling"
  sources:
    - name: "routine_campus_activities"
      ratio: 0.40
      examples: ["hallway walking", "classroom entry/exit", "courtyard gathering", "sitting on benches"]
    - name: "rapid_benign_motion"
      ratio: 0.35
      examples: ["students running to catch bus/class", "playful high-fives", "dancing", "gesturing"]
    - name: "sports_and_athletic_activities"
      ratio: 0.15
      examples: ["basketball court games", "soccer practice", "gym workouts"]
    - name: "camera_artifacts_and_environmental"
      ratio: 0.10
      examples: ["PTZ camera pan/tilt", "wind-induced camera pole vibration", "sudden sunlight transitions"]

# ---------------------------------------------------------------------------
# Preprocessing Clip Parameters
# ---------------------------------------------------------------------------
clip_parameters:
  clip_length_frames: 16       # 16 frames window
  sampling_stride: 2           # Sample every 2nd frame (effective 15 FPS from 30 FPS source)
  clip_duration_seconds: 1.07  # (16 * 2) / 30 = 1.07s
  alternative_longer_window:
    clip_length_frames: 32
    sampling_stride: 2
    clip_duration_seconds: 2.13
  spatial_resolution: [112, 112]
  color_space: "RGB"
  normalization:
    mean: [0.43216, 0.394666, 0.37645]
    std: [0.22803, 0.22145, 0.216989]
