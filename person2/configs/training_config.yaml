# Training and Experiment Configuration
# Project: Temporal Behavior Recognition and Violence Classification

experiment:
  name: "xd_violence_video_mil_r3d18"
  seed: 42
  output_dir: "./checkpoints"
  log_dir: "./logs"

model:
  # Options: 'r2plus1d_18', 'r3d_18', 'mc3_18', 'custom_3d_cnn'
  architecture: "r3d_18"
  pretrained: true
  num_classes: 1               # Binary classification (sigmoid activation output)
  dropout_rate: 0.5
  # Fine-tuning mode:
  # - 'head_only': Freeze backbone, train only classification head (fast baseline, low VRAM)
  # - 'partial': Train top residual stages (layer3, layer4) and classification head
  # - 'full': End-to-end fine-tuning across all 3D convolution layers
  fine_tune_mode: "partial"
  use_motion_excitation: true  # Temporal difference motion excitation module to reduce background bias

dataset:
  name: "XD-Violence"
  supervision: "weak_video_mil"
  train_manifest: "./data/splits/xd_train_manifest.json"
  val_manifest: "./data/splits/xd_val_manifest.json"
  test_manifest: "./data/splits/xd_test_manifest.json"
  clips_per_video: 4
  mil_top_k: 1
  clip_length: 16
  sampling_stride: 2
  spatial_resolution: [112, 112]
  normalization:
    mean: [0.43216, 0.394666, 0.37645]
    std: [0.22803, 0.22145, 0.216989]
  num_workers: 2

augmentation:
  train:
    horizontal_flip_prob: 0.5
  val: {}                       # Deterministic center placement within each clip segment

training:
  epochs: 25
  batch_size: 2               # videos per batch; each video contributes four clips
  mixed_precision: true         # Uses torch.cuda.amp on GPU
  gradient_clip_norm: 1.0

  optimizer:
    name: "AdamW"
    backbone_lr: 1.0e-5
    head_lr: 1.0e-4
    weight_decay: 1.0e-4

  scheduler:
    name: "CosineAnnealingLR"
    t_max: 25
    eta_min: 1.0e-6

  loss:
    name: "focal"               # Options: 'focal', 'weighted_bce', 'bce'
    focal_alpha: 0.25
    focal_gamma: 2.0
    pos_weight: 2.5             # Weight assigned to positive (violence) class if using weighted_bce

  early_stopping:
    enabled: true
    patience: 6
    metric: "val_f1"            # Monitor validation F1-score
    mode: "max"

evaluation:
  decision_threshold: 0.50      # Select/tune on validation data, then freeze for test
  high_confidence_threshold: 0.75 # Threshold for high-priority dispatch
  temporal_smoothing_window: 3  # Moving average across consecutive clip predictions
